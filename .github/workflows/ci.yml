name: CI

# The project is developed on Windows, where no Swift toolchain or iOS SDK exists.
# This runner is therefore the ONLY place the code is ever actually compiled, so it
# is deliberately verbose: it captures the full xcodebuild output as an artifact and
# prints every distinct error at the end rather than failing on the first one.
# `scripts/precheck.py` catches the cheap classes of mistake locally before you get here.

# On demand only. A macOS runner costs ~8 minutes and 10x the billing minutes of a
# Linux one, and most pushes on this branch do not need a compile — the local
# pre-flight (scripts/precheck.py, with a real `swiftc -parse` when a toolchain is
# installed) covers the fast feedback. Trigger a run with:
#     gh workflow run CI --ref <branch>
#     gh workflow run CI --ref <branch> -f run_tests=false     # compile only
# or from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Run the test suite after building"
        type: boolean
        default: true
        required: false
      build_unsigned_ipa:
        description: "Build an unsigned release IPA for AltStore/Sideloadly (personal free Apple ID)"
        type: boolean
        default: false
        required: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Record the toolchain we actually got
        # macos-latest moves between images. Pin `runs-on` to a specific label once you
        # know which Xcode you want; until then, this is how you find out what you had.
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Create the local signing config
        # Config/Local.xcconfig is gitignored because it carries a personal Team ID.
        # No Apple team is needed for a simulator build, but signing must stay ENABLED:
        # Xcode signs simulator products ad-hoc ("-") and that is what applies the
        # entitlements. With signing off, every Keychain call returns
        # errSecMissingEntitlement (-34018) -- and since the client pairing now lives in
        # the Keychain, that silently fails ~25 tests as "notPaired", which reads like a
        # real bug and is not one.
        #
        # DEVELOPMENT_TEAM is deliberately left EMPTY. It briefly carried a hardcoded team
        # id, because the code used to ask for a keychain group with that prefix baked in
        # while the entitlement built one from $(AppIdentifierPrefix) -- with no team the
        # two disagreed and every Keychain call returned -34018. KeychainAccessGroupResolver
        # now reads the granted group back from the keychain at runtime, so no team is
        # needed. Keeping the field empty is the point: this runner is the only place that
        # exercises the path a contributor signing with their own team takes, and putting a
        # team id back would silently stop testing it.
        run: |
          printf 'DEVELOPMENT_TEAM =\nCODE_SIGN_IDENTITY = -\nCODE_SIGNING_REQUIRED = NO\nCODE_SIGNING_ALLOWED = YES\n' \
            > Config/Local.xcconfig
          cat Config/Local.xcconfig

      - name: Generate the Xcode project
        run: |
          xcodegen generate
          xcodebuild -project AAPSClientiOS.xcodeproj -list

      - name: Verify the generated Info.plist matches the tracked one
        # App/Info.plist is generated from project.yml but tracked in git, so it can
        # silently drift. A missing BGTaskSchedulerPermittedIdentifiers entry crashes
        # the app at launch, before any UI - worth failing the build over.
        run: |
          if ! git diff --quiet -- App/Info.plist; then
            echo "::error file=App/Info.plist::App/Info.plist is stale - run 'xcodegen generate' and commit the result"
            git --no-pager diff -- App/Info.plist
            exit 1
          fi
          echo "Info.plist is in sync with project.yml"

      - name: Pick a simulator
        id: sim
        # Resolving a concrete UDID beats hardcoding a device name: the set of
        # preinstalled simulators changes with every runner image bump, and a stale
        # name fails with an unhelpful "Unable to find a destination".
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, re, sys
          data = json.load(sys.stdin)["devices"]
          def version(runtime):
              m = re.search(r"iOS-([0-9]+)-([0-9]+)", runtime)
              return (int(m.group(1)), int(m.group(2))) if m else (0, 0)
          best = None
          for runtime, devices in data.items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  if not device.get("isAvailable") or "iPhone" not in device["name"]:
                      continue
                  key = version(runtime)
                  if best is None or key > best[0]:
                      best = (key, device)
          if best is None:
              sys.exit("no available iPhone simulator on this runner")
          sys.stderr.write("using %s (iOS %d.%d)\n" % (best[1]["name"], *best[0]))
          print(best[1]["udid"])
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build
        # `build-for-testing`, not `build`: the scheme lists AAPSClientiOSTests only
        # under its test action, so a plain `build` compiles the app and widget but
        # never produces the .xctest bundle — and `test-without-building` then dies
        # with "Failed to create a bundle instance ... check that the bundle exists
        # on disk", which reads like a code failure and is not one.
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project AAPSClientiOS.xcodeproj \
            -scheme AAPSClientiOS \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -configuration Debug \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=YES \
            2>&1 | tee build.log

      - name: Test
        if: (success() || failure()) && inputs.run_tests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project AAPSClientiOS.xcodeproj \
            -scheme AAPSClientiOS \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee test.log

      - name: Summarise every distinct failure
        # The whole point: a first compile of a large unverified change produces many
        # errors, most of them the same mistake repeated. Grouping them makes the diff
        # fixable in one pass instead of one CI round-trip per error.
        if: failure()
        run: |
          {
            echo "## Compile / test failures"
            echo
            echo '```'
            grep -hE '(error|warning): ' build.log test.log 2>/dev/null \
              | sed 's/^.*\/AAPSClientiOS\///' \
              | sort -u \
              | head -200
            echo '```'
            echo
            echo "Full logs are in the **build-logs** artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            test.log
          retention-days: 14
          if-no-files-found: warn

      - name: Upload test results
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: DerivedData/Logs/Test/*.xcresult
          retention-days: 14
          if-no-files-found: ignore

  precheck:
    # The same static checks the pre-push hook runs locally, re-run here so a bypassed
    # hook (`git push --no-verify`) cannot land a regression the laptop would have caught.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      # No --strict: this runner has no Swift toolchain, so precheck always emits the
      # "swiftc not found" warning, and the two heuristic checks warn by design.
      - run: python scripts/precheck.py
      - name: Self-test the checker
        # Guards against precheck.py silently degrading into something that always
        # passes. Restores every file it mutates, so the checkout stays pristine.
        run: python scripts/precheck_selftest.py

  build-unsigned-ipa:
    # Produces an unsigned Release IPA installable via AltStore / Sideloadly / TrollStore.
    # No Apple Developer Program membership, no certificates, no provisioning profiles
    # are required — the user re-signs locally with their free personal Apple ID
    # (7-day validity for AltStore/Sideloadly, or permanent if TrollStore-compatible).
    #
    # Entitlements (keychain-access-groups, app groups, time-sensitive notifications)
    # are embedded in the .app bundle at build time, so the re-signed IPA retains all
    # capabilities after AltStore/Sideloadly injects its own signature.
    #
    # Trigger only when the checkbox is ticked — this adds a second macOS runner and
    # doubles the billing minutes for that run.
    if: inputs.build_unsigned_ipa == true
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Record the toolchain
        run: |
          sw_vers
          xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Create unsigned signing config
        # No team, no identity, no signing. The build produces a fully-formed .app
        # bundle whose entitlements are copied from the .entitlements files into the
        # bundle — these are plain file copies, independent of code signing.
        run: |
          printf 'DEVELOPMENT_TEAM =\nCODE_SIGN_IDENTITY =\nCODE_SIGNING_REQUIRED = NO\nCODE_SIGNING_ALLOWED = NO\n' \
            > Config/Local.xcconfig
          cat Config/Local.xcconfig

      - name: Generate the Xcode project
        run: |
          xcodegen generate
          xcodebuild -project AAPSClientiOS.xcodeproj -list

      - name: Verify the generated Info.plist matches the tracked one
        run: |
          if ! git diff --quiet -- App/Info.plist; then
            echo "::error file=App/Info.plist::App/Info.plist is stale - run 'xcodegen generate' and commit the result"
            git --no-pager diff -- App/Info.plist
            exit 1
          fi
          echo "Info.plist is in sync with project.yml"

      - name: Archive (Release, unsigned)
        # Archive against generic iOS device so we get a fat arm64 + arm64e binary.
        # -allowProvisioningUpdates is harmless here (signing is disabled globally)
        # but kept because some Xcode builds otherwise error on missing profiles.
        run: |
          set -o pipefail
          xcodebuild archive \
            -project AAPSClientiOS.xcodeproj \
            -scheme AAPSClientiOS \
            -destination 'generic/platform=iOS' \
            -archivePath build/AAPSClientiOS.xcarchive \
            -configuration Release \
            -allowProvisioningUpdates \
            CODE_SIGN_IDENTITY= \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM= \
            ONLY_ACTIVE_ARCH=NO \
            2>&1 | tee archive.log

      - name: Write export options for unsigned IPA
        # development method + manual signing + no profile references produces a
        # package that any re-signer (AltStore, Sideloadly) can consume directly.
        # `uploadSymbols` is off — that requires App Store Connect access.
        run: |
          cat > ExportOptions-AdHoc.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string></string>
            <key>provisioningProfiles</key>
            <dict/>
            <key>uploadSymbols</key>
            <false/>
          </dict>
          </plist>
          PLIST
          cat ExportOptions-AdHoc.plist

      - name: Export unsigned IPA
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/AAPSClientiOS.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions-AdHoc.plist \
            -allowProvisioningUpdates \
            CODE_SIGN_IDENTITY= \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee export.log
          echo "---"
          ls -la build/export/*.ipa 2>/dev/null || { echo "::error::No IPA produced — see export.log"; exit 1; }

      - name: Verify the IPA is unsigned
        # Quick sanity: AltStore/Sideloadly re-signers expect the app binary to
        # carry no embedded signature. This check saves the user from downloading
        # a "pre-signed" IPA that won't install on their device.
        run: |
          IPA=$(ls build/export/*.ipa | head -1)
          echo "Checking $IPA"
          unzip -o "$IPA" -d build/ipa_extract > /dev/null
          APP_PATH=$(find build/ipa_extract -name 'AAPSClientiOS.app' -type d | head -1)
          if [ -z "$APP_PATH" ]; then echo "::error::.app bundle not found inside IPA"; exit 1; fi
          echo "App bundle: $APP_PATH"
          # codesign --verify fails on unsigned binaries — that's what we want.
          if codesign --verify --deep --strict "$APP_PATH" 2>/dev/null; then
            echo "::error::IPA is already signed — AltStore will refuse to re-sign it."
            exit 1
          else
            echo "OK — IPA is unsigned, ready for AltStore/Sideloadly."
          fi

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: AAPSClientiOS-unsigned
          path: build/export/*.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Upload build logs
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: ipa-build-logs
          path: |
            archive.log
            export.log
          retention-days: 14
          if-no-files-found: warn
